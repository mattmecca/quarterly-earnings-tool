apiVersion: v1
kind: Pod
metadata:
  name: quarterly-earnings-pod-1
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: alpine
    image: alpine
    command:
    - sleep
    - "3600"
    volumeMounts:
    - name: pv-mydata
      mountPath: /mydata
  volumes:
  - name: pv-mydata
    persistentVolumeClaim:
      claimName: quarterly-earnings-pvc
---
