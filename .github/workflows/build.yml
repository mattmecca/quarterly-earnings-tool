# Workflow Name
name: quarterly-earnings-tool-infra

# Workflow Triggers
# on:
#   push:
#     branches:
#       - production
#     paths:  
#       - terraform/** # INDICATES EVERYTHING INSIDE TERRAFORM FOLDER IS WHAT WE WANT TO WORK ON
#   workflow_dispatch: # Enables manual trigger for destroy job
# Workflow Triggers
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: terraform create or destroy'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'

# Environment Variables
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}

# Define Jobs
jobs:
  terraform:
    name: "Create Infra with Terraform on AWS"
    runs-on: ubuntu-latest
    # Run only on push events
    if: github.event.inputs.action == 'apply' # github.event_name == 'push'  

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps: # Can find these & MORE on Github Marketplace (https://github.com/marketplace?type=actions)
      - name: Checkout source code
        uses: actions/checkout@v4 # CHECKS OUT CODE

      - name: Setup Terraform # Action that allows us to perform TERRAFORM COMMANDS
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$S3_BUCKET"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile # Workflow NOT interactive, simply generate PLAN for us
        continue-on-error: true

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # - name: Import existing KMS resources
      #   run: |
      #     echo "Checking for existing KMS resources..."
          
      #     # Check if KMS alias exists
      #     if aws kms describe-key --key-id "alias/eks/${{ env.EKS_CLUSTER }}-eks" &>/dev/null; then
      #       echo "KMS alias exists, checking Terraform state..."
            
      #       # Check if already in Terraform state
      #       if ! terraform state show 'module.eks.aws_kms_alias.this[0]' &>/dev/null; then
      #         echo "Importing KMS alias..."
      #         terraform import 'module.eks.aws_kms_alias.this[0]' "alias/eks/${{ env.EKS_CLUSTER }}-eks"
      #       fi
            
      #       # Get the KMS key ID and import if needed
      #       KEY_ID=$(aws kms describe-key --key-id "alias/eks/${{ env.EKS_CLUSTER }}-eks" --query 'KeyMetadata.KeyId' --output text)
      #       if ! terraform state show 'module.eks.aws_kms_key.this[0]' &>/dev/null; then
      #         echo "Importing KMS key..."
      #         terraform import 'module.eks.aws_kms_key.this[0]' "$KEY_ID"
      #       fi
      #     else
      #       echo "No existing KMS resources found."
      #     fi

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile # parallelism=1 means we want to run ONE STEP AT A TIME

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }} # env. bc we DEFINED THEM ABOVE
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Kubernetes config
        id: getconfig
        if: steps.apply.outcome == 'success' # If 
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} 

      - name: Install Ingress controller # Ingress controller a load balancer that manages external access to services within Kubernetes cluster
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/aws/deploy.yaml
          echo "Ingress controller installation initiated. Pods may take a few minutes to be ready."

      - name: Install ArgoCD
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: |
          # Create argocd namespace
          kubectl create namespace argocd
          # Install ArgoCD
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          # Wait for ArgoCD to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
          
          # Create Ingress for ArgoCD
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server-ingress
            namespace: argocd
            annotations:
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
          spec:
            rules:
            - host: argocd.${{ env.EKS_CLUSTER }}.local  # You can customize this domain
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 443
          EOF
          
          # Wait for Ingress to get an external IP
          echo "Waiting for Ingress to get external IP..."
          kubectl wait --for=jsonpath='{.status.loadBalancer.ingress}' ingress/argocd-server-ingress -n argocd --timeout=300s
          
          # Get external access information
          EXTERNAL_IP=$(kubectl get ingress argocd-server-ingress -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ArgoCD is accessible at: https://$EXTERNAL_IP"
          echo "ArgoCD admin password:"
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
          echo ""

      # - name: Setup Route53 DNS for ArgoCD (Optional)
      #   if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
      #   run: |
      #     # Get the load balancer hostname
      #     LB_HOSTNAME=$(kubectl get ingress argocd-server-ingress -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
      #     # Create Route53 record (requires HOSTED_ZONE_ID environment variable)
      #     if [ ! -z "${{ vars.HOSTED_ZONE_ID }}" ]; then
      #       aws route53 change-resource-record-sets --hosted-zone-id ${{ vars.HOSTED_ZONE_ID }} --change-batch '{
      #         "Changes": [{
      #           "Action": "UPSERT",
      #           "ResourceRecordSet": {
      #             "Name": "argocd.${{ vars.DOMAIN_NAME }}",
      #             "Type": "CNAME",
      #             "TTL": 300,
      #             "ResourceRecords": [{"Value": "'$LB_HOSTNAME'"}]
      #           }
      #         }]
      #       }'
      #       echo "ArgoCD will be accessible at: https://argocd.${{ vars.DOMAIN_NAME }}"
      #     fi

      - name: Configure ArgoCD Application
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        working-directory: ./  # Override the default terraform directory
        run: |
          # Apply the ArgoCD application from your repository
          kubectl apply -f argocd/quarterly-earnings-app.yaml
          
          # Verify application was created
          echo "Waiting for ArgoCD Application to be created..."
          for i in {1..30}; do
            if kubectl get application quarterly-earnings-tool -n argocd &> /dev/null; then
              echo "ArgoCD Application created successfully!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          echo "ArgoCD Application created. You can view it in the ArgoCD UI."

      - name: Delete ArgoCD
        if: failure()
        run: |
          kubectl delete ingress argocd-server-ingress -n argocd --ignore-not-found=true
          kubectl delete namespace argocd --ignore-not-found=true

      - name: Delete Ingress controller
        if: failure()
        run: |
          kubectl delete -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/aws/deploy.yaml

      - name: Empty ECR Repository
        if: failure()
        run: |
          REPOSITORY_NAME=${{ vars.ECR_REPOSITORY }}
          IMAGES=$(aws ecr list-images --repository-name $REPOSITORY_NAME --query 'imageIds[*]' --output json)
          if [[ "$IMAGES" != "[]" ]]; then
            echo "Deleting images from $REPOSITORY_NAME..."
            aws ecr batch-delete-image --repository-name $REPOSITORY_NAME --image-ids "$IMAGES"
          else
            echo "No images found in $REPOSITORY_NAME."
          fi

        # aws ecr batch-delete-image --repository-name $REPOSITORY_NAME \
        #     --image-ids "$(aws ecr list-images --repository-name $REPOSITORY_NAME --query 'imageIds[*]' --output json
        # )" || true

      - name: Run Terraform destroy
        if: failure()
        run: |
          terraform destroy -auto-approve -input=false


  # The below DELETE COMMAND needs to be triggered MANUALLY
  destroy:
    name: "Destroy Infra on AWS"
    runs-on: ubuntu-latest
    # Only trigger for workflow_dispatch
    if: github.event.inputs.action == 'destroy'

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$S3_BUCKET"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Kubernetes config
        id: getconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} 
      
      - name: Delete ArgoCD
        run: |
          kubectl delete ingress argocd-server-ingress -n argocd --ignore-not-found=true  
          kubectl delete namespace argocd --ignore-not-found=true

      # NEED to delete INGRESS CONTROLLER LOAD BALANCER **BEFORE** DELETING KUBERNETES CLUSTER
      - name: Delete Ingress controller
        run: kubectl delete -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/aws/deploy.yaml

      # Also want to EMPTY ECR REPO of STORED IMAGES **BEFORE** IT IS DELETED
      - name: Empty ECR Repository
        if: failure()
        run: |
          REPOSITORY_NAME=${{ vars.ECR_REPOSITORY }}
          IMAGES=$(aws ecr list-images --repository-name $REPOSITORY_NAME --query 'imageIds[*]' --output json)
          if [[ "$IMAGES" != "[]" ]]; then
            echo "Deleting images from $REPOSITORY_NAME..."
            aws ecr batch-delete-image --repository-name $REPOSITORY_NAME --image-ids "$IMAGES"
          else
            echo "No images found in $REPOSITORY_NAME."
          fi

      # FINALLY, we execute `terraform destroy ...` command
      - name: Terraform destroy
        id: destroy
        if: failure()
        run: terraform destroy -auto-approve -input=false
