name: quarterly-earnings-tool-code
on:
  push:
    branches:
        - production
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}

jobs:
  BuildandPush:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
    
      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
         access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
         secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         registry: ${{ secrets.ECR_REGISTRY }}
         repo: ${{ env.ECR_REPOSITORY }}
         region: ${{ env.AWS_REGION }}
         tags: ${{ github.run_number }}
         daemon_off: false
         dockerfile: ./Dockerfile
         context: ./
  DeployToEKS:
    needs: BuildandPush # I.e., BuildandPush NEEDS to COMPLETE before DeployToEKS can run
    runs-on: ubuntu-latest
    steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
        
        - name: Get Kubernetes config
          id: getconfig
          run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

        # || in kubectl .. || mean IF `secret regcred` not available, execute `kubectl create secret ...`
        - name: Login to ECR
          run: |
            kubectl get secret regcred || \
            kubectl create secret docker-registry regcred \
              --docker-server=${{ secrets.ECR_REGISTRY }} \
              --docker-username=AWS \
              --docker-password=$(aws ecr get-login-password)

        - name: Clean up existing resources
          run: |
            echo "Cleaning up existing resources that conflict with Helm..."
            
            # Configure kubectl
            aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
            
            # Delete existing resources that Helm will recreate
            kubectl delete secret db-secret -n default --ignore-not-found=true
            kubectl delete configmap app-config -n default --ignore-not-found=true
            
            # Wait a moment for deletion to complete
            sleep 10
            
            echo "Cleanup completed"

        - name: Deploy with Helm
          uses: bitovi/github-actions-deploy-eks-helm@v1.2.12
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
            cluster-name: ${{ env.EKS_CLUSTER }}
            chart-path: helm/appcharts # References EVERYTHING in `appcharts`
            namespace: default
            values: appimage=${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }},apptag=${{ github.run_number }}
            name: webapp-stack
        
        - name: Show Pods
          run: kubectl get pod -A # Shows us all the kubernetes pods
        
        - name: Show Ingress
          run: kubectl get ingress # Shows us the ingress controller
