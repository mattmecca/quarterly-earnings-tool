name: quarterly-earnings-tool-code
on:
  push:
    branches:
        - production

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}

jobs:
  BuildandPush:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
    
      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
         access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
         secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         registry: ${{ secrets.ECR_REGISTRY }}
         repo: ${{ env.ECR_REPOSITORY }}
         region: ${{ env.AWS_REGION }}
         tags: ${{ github.run_number }}
         daemon_off: false
         dockerfile: ./Dockerfile
         context: ./
  DeployToEKS:
    needs: BuildandPush # I.e., BuildandPush NEEDS to COMPLETE before DeployToEKS can run
    runs-on: ubuntu-latest
    steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
        
        - name: Get Kubernetes config
          id: getconfig
          run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

        # || in kubectl .. || mean IF `secret regcred` not available, execute `kubectl create secret ...`
        - name: Login to ECR
          run: |
            kubectl get secret regcred || \
            kubectl create secret docker-registry regcred \
              --docker-server=${{ secrets.ECR_REGISTRY }} \
              --docker-username=AWS \
              --docker-password=$(aws ecr get-login-password)

        - name: Clean up completely before deploy
          run: |
            echo "Complete cleanup of default namespace..."
            aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
            
            # Force delete all Helm releases
            helm list -n default --short | xargs -r helm uninstall -n default || true
            
            # Delete all resources in default namespace
            kubectl delete all,secrets,configmaps,pvc,ingress --all -n default --ignore-not-found=true || true
            
            # Wait for complete cleanup
            sleep 60
            
            # Verify nothing is left
            kubectl get all -n default

        - name: Create values file
          run: |
            cat <<EOF > helm-values.yaml
            appimage: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
            apptag: ${{ github.run_number }}
            mysql:
              rootPassword: "contactform-rootpass" #! Need to replace these with Github secrets
              user: "contactformdb-admin" #! Need to replace these with Github secrets
              password: "contactform-password" #! Need to replace these with Github secrets
            pma:
              user: "contactformdb-pmadmin" #! Need to replace these with Github secrets
              password: "contactform-password" #! Need to replace these with Github secrets
            EOF

        - name: Deploy with Helm
          run: |
            # Update kubeconfig
            aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
            
            # Deploy using helm directly
            helm upgrade --install webapp-stack helm/appcharts \
              --namespace default \
              --create-namespace \
              --values helm-values.yaml \
              --set appimage=${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
              --set apptag=${{ github.run_number }} \
              --set mysql.rootPassword="contactform-rootpass" \
              --set mysql.user="contactformdb-admin" \
              --set mysql.password="contactform-password" \
              --set pma.user="contactformdb-pmadmin" \
              --set pma.password="contactform-password" \
              --timeout 15m # \
              # --wait

            # Check what was created
            echo "Checking deployed resources..."
            kubectl get all -n default
            kubectl get ingress -n default
            kubectl get pvc -n default
            
            # Check pod status
            echo "Checking pod details..."
            kubectl describe pods -n default
            
            # Wait for deployment to be ready (with longer timeout)
            echo "Waiting for deployments to be ready..."
            kubectl wait --for=condition=available deployment --all -n default --timeout=900s || {
              echo "Deployment not ready, checking pod logs..."
              kubectl get pods -n default
              kubectl logs -l app=php-app -n default --tail=50 || true
              kubectl logs -l app=mysql-db -n default --tail=50 || true
            }

          # uses: bitovi/github-actions-deploy-eks-helm@v1.2.12
          # with:
          #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #   aws-region: ${{ env.AWS_REGION }}
          #   cluster-name: ${{ env.EKS_CLUSTER }}
          #   chart-path: helm/appcharts
          #   namespace: default
          #   config-files: helm-values.yaml
          #   name: webapp-stack
          #   create-namespace: true

        - name: Show Pods
          run: kubectl get pod -A # Shows us all the kubernetes pods
        
        - name: Show Ingress
          run: kubectl get ingress -n default # Shows us the ingress controller
