apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quarterly-earnings-tool
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mattmecca/quarterly-earnings-tool.git
    targetRevision: HEAD
    path: helm/appcharts
    helm:
      valueFiles:
        - values.yaml
      # Remove the parameters section for now - let values.yaml handle defaults
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s